<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MiniQuest</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111827);
      --hint: var(--tg-theme-hint-color, #6b7280);
      --btn: var(--tg-theme-button-color, #2563eb);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --sec-bg: var(--tg-theme-secondary-bg-color, #f3f4f6);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--tg-theme-bg-color, #17212b);
        --text: var(--tg-theme-text-color, #f9fafb);
        --hint: var(--tg-theme-hint-color, #708499);
        --btn: var(--tg-theme-button-color, #5288c1);
        --sec-bg: var(--tg-theme-secondary-bg-color, #0e1621);
      }
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 90vh;
      box-sizing: border-box;
    }
    .card {
      background: var(--sec-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-sizing: border-box;
    }
    .score-display {
      font-size: 48px;
      font-weight: 800;
      color: var(--btn);
      margin: 16px 0;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-outline {
      background: transparent;
      color: var(--btn);
      border: 1px solid var(--btn);
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--hint);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="greeting">Welcome Player!</h2>
    <p style="color: var(--hint);">Tap to score points, then submit to Telegram Serverless.</p>
    
    <div class="score-display" id="score">0</div>
    
    <button class="btn" id="tapBtn">Tap to Score (+10) ⚡</button>
    <button class="btn btn-outline" id="submitBtn">Save High Score 💾</button>
    <button class="btn btn-outline" id="shareBtn">Share High Score 🚀</button>
    <button class="btn" id="finishBtn">Finish & Return to Bot ✅</button>

    <div class="status" id="statusMsg">Ready</div>
  </div>

  <script type="module">
    import { createClient } from '/dist/client.js';

    const client = createClient();
    client.ready().expand();

    let currentScore = 0;
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('statusMsg');
    const greetingEl = document.getElementById('greeting');

    if (client.user) {
      greetingEl.innerText = `Welcome ${client.user.first_name}!`;
    }

    // Load saved score from Telegram CloudStorage
    client.cloudStorage.getItem('high_score').then(val => {
      if (val) {
        currentScore = parseInt(val, 10) || 0;
        scoreEl.innerText = currentScore;
        statusEl.innerText = `Loaded saved score: ${currentScore}`;
      }
    });

    document.getElementById('tapBtn').addEventListener('click', () => {
      currentScore += 10;
      scoreEl.innerText = currentScore;
      client.haptic.impact('light');
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
      statusEl.innerText = 'Submitting score...';
      try {
        const res = await client.call('submitScore', { score: currentScore });
        await client.cloudStorage.setItem('high_score', currentScore);
        client.haptic.notification('success');
        statusEl.innerText = `Score saved! Rank confirmed.`;
      } catch (err) {
        client.haptic.notification('error');
        statusEl.innerText = `Error: ${err.message}`;
      }
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      statusEl.innerText = 'Preparing share card...';
      try {
        const prep = await client.call('prepareShare', { score: currentScore });
        await client.shareMessage(prep.id);
        client.haptic.notification('success');
        statusEl.innerText = 'Share card opened!';
      } catch (err) {
        statusEl.innerText = `Share failed: ${err.message}`;
      }
    });

    document.getElementById('finishBtn').addEventListener('click', () => {
      // Send data back to the bot via service message:
      client.sendData({ action: 'game_completed', score: currentScore });
    });
  </script>
</body>
</html>
